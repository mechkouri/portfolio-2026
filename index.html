<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Said Mechkouri — Full-Stack Developer · WordPress · SEO &amp; Automation</title>
    <meta
      name="description"
      content="Full-stack developer in Marrakech, Morocco. I build React and Next.js apps, WordPress websites, technical SEO, and n8n &amp; Make.com automations."
    />
    <meta name="author" content="Said Mechkouri" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light dark" />
    <!-- Light is the default; apply a saved dark choice before first paint so the page does not flash. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <link rel="canonical" href="https://mechkouri.netlify.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mechkouri.netlify.app/" />
    <meta property="og:title" content="Said Mechkouri — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Websites, web apps, and the automations behind them. React, Next.js, WordPress, SEO, n8n &amp; Make.com."
    />
    <meta property="og:image" content="https://mechkouri.netlify.app/images/portrait-office.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/images/portrait-studio.webp" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Said Mechkouri",
        "jobTitle": "Full-Stack Developer",
        "email": "saidmechkouri@gmail.com",
        "url": "https://mechkouri.netlify.app/",
        "image": "https://mechkouri.netlify.app/images/portrait-office.webp",
        "address": { "@type": "PostalAddress", "addressLocality": "Marrakech", "addressCountry": "MA" },
        "sameAs": ["https://github.com/Mechkouri", "https://www.linkedin.com/in/said-mechkouri/"],
        "knowsAbout": ["React", "Next.js", "TypeScript", "WordPress", "Technical SEO", "n8n", "Make.com", "AI-assisted development"]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Said Mechkouri — Full-Stack Developer · WordPress Developer · SEO &amp; Automation. Please enable JavaScript to view
        the full portfolio.
      </p>
    </noscript>
    <!-- Static copy of the contact form so Netlify Forms can detect it at build time. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
