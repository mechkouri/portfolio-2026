<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Said Mechkouri — Software Engineer, Frontend Developer &amp; Automation Specialist</title>
    <meta
      name="description"
      content="Said Mechkouri builds fast React and WordPress websites, technical SEO, and n8n &amp; Make.com AI automation workflows that eliminate manual work. Based in Morocco, available for freelance projects."
    />
    <meta name="author" content="Said Mechkouri" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://mechkouri.netlify.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mechkouri.netlify.app/" />
    <meta property="og:title" content="Said Mechkouri — Software Engineer &amp; Automation Specialist" />
    <meta
      property="og:description"
      content="Full-stack web applications, high-converting websites, and intelligent n8n &amp; Make.com AI automation workflows."
    />
    <meta property="og:image" content="https://mechkouri.netlify.app/images/portrait-office.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/images/portrait-studio.webp" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Said Mechkouri",
        "jobTitle": "Software Engineer & Automation Specialist",
        "url": "https://mechkouri.netlify.app/",
        "image": "https://mechkouri.netlify.app/images/portrait-office.webp",
        "address": { "@type": "PostalAddress", "addressLocality": "Casablanca", "addressCountry": "MA" },
        "sameAs": ["https://github.com/Mechkouri"],
        "knowsAbout": ["React", "TypeScript", "WordPress", "Technical SEO", "n8n", "Make.com", "AI automation"]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Said Mechkouri — Software Engineer, Frontend Developer &amp; Automation Specialist. Please enable JavaScript to view
        the full portfolio.
      </p>
    </noscript>
    <!-- Static copy of the contact form so Netlify Forms can detect it at build time. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
